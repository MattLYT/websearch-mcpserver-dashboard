interface:
  display_name: "WebSearch 协作检索"
  short_description: "协同检索网页、论文和原文，按可用能力定位本地文件"
  default_prompt: "使用 $websearch-mcp 调查这个问题，按需要衔接网页、论文和全文读取，并给出有出处的结论。"
dependencies:
  tools:
    - type: "mcp"
      value: "websearch"
      description: "本机 Docker WebSearch MCP"
      transport: "streamable_http"
      url: "http://127.0.0.1:8338/mcp"
policy:
  allow_implicit_invocation: true
